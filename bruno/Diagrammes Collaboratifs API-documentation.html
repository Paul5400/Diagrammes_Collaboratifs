    <title>Diagrammes Collaboratifs API - API Documentation</title>
    <style>
        body { margin: 0; padding: 0; }
        #opencollection-container { width: 100vw; height: 100vh; }

<body>
    <div id="opencollection-container"></div>
    <script>
        const collectionData = "opencollection: 1.0.0\ninfo:\n  name: Diagrammes Collaboratifs API\nconfig:\n  environments:\n    - name: local\n      variables:\n        - name: baseUrl\n          value: http://localhost:3002\n        - name: token\n          value: YOUR_JWT_TOKEN_HERE\nitems:\n  - info:\n      name: Diagrammes\n      type: folder\n    items:\n      - info:\n          name: Get Diagram History\n          type: http\n          seq: 1\n        http:\n          method: GET\n          url: '{{baseUrl}}/diagrammes/:id/history'\n          params:\n            - name: id\n              value: '{{diagrammeId}}'\n              type: path\n          auth:\n            type: bearer\n            token: '{{authToken}}'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # R\xE9cup\xE9rer l'historique d'un diagramme\n\n          R\xE9cup\xE8re l'historique des versions d'un diagramme depuis GitHub.\n\n          ## Pr\xE9requis\n          - Le diagramme doit avoir \xE9t\xE9 sauvegard\xE9 au moins une fois (cheminGit non null)\n          - Le projet doit avoir un d\xE9p\xF4t GitHub associ\xE9\n\n          ## R\xE9ponse\n          ```json\n          [\n            {\n              \"sha\": \"abc123def456...\",\n              \"message\": \"Update: Mon diagramme\",\n              \"author\": \"Jean Dupont\",\n              \"date\": \"2026-02-16T10:30:00Z\",\n              \"url\": \"https://github.com/user/repo/commit/abc123...\"\n            },\n            {\n              \"sha\": \"xyz789...\",\n              \"message\": \"Initial commit\",\n              \"author\": \"Jean Dupont\",\n              \"date\": \"2026-02-15T14:20:00Z\",\n              \"url\": \"https://github.com/user/repo/commit/xyz789...\"\n            }\n          ]\n          ```\n\n          ## Codes d'erreur\n          - 401 Unauthorized : Token JWT invalide\n          - 403 Forbidden : Vous n'avez pas acc\xE8s \xE0 ce diagramme\n          - 404 Not Found : Diagramme introuvable\n          - 400 Bad Request : Diagramme pas encore sauvegard\xE9 sur GitHub\n      - info:\n          name: Get Diagram Version\n          type: http\n          seq: 2\n        http:\n          method: GET\n          url: '{{baseUrl}}/diagrammes/:id/version/:sha'\n          params:\n            - name: id\n              value: '{{diagrammeId}}'\n              type: path\n            - name: sha\n              value: '{{commitSha}}'\n              type: path\n          auth:\n            type: bearer\n            token: '{{authToken}}'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # R\xE9cup\xE9rer une version sp\xE9cifique d'un diagramme\n\n          R\xE9cup\xE8re le contenu d'un diagramme \xE0 une version sp\xE9cifique (commit SHA).\n\n          ## Pr\xE9requis\n          - Le diagramme doit avoir \xE9t\xE9 sauvegard\xE9 au moins une fois\n          - Le SHA doit correspondre \xE0 un commit valide dans l'historique\n\n          ## R\xE9ponse\n          ```json\n          {\n            \"contenu\": \"graph TD\\n    A[Start] --> B[End]\",\n            \"sha\": \"abc123def456...\",\n            \"titre\": \"Mon diagramme\"\n          }\n          ```\n\n          ## Utilisation\n          1. R\xE9cup\xE9rer l'historique avec GET /diagrammes/:id/history\n          2. Choisir un SHA dans la liste\n          3. R\xE9cup\xE9rer le contenu avec cet endpoint\n          4. (Optionnel) Restaurer cette version en faisant un PATCH /diagrammes/:id avec le contenu\n\n          ## Codes d'erreur\n          - 401 Unauthorized : Token JWT invalide\n          - 403 Forbidden : Vous n'avez pas acc\xE8s \xE0 ce diagramme\n          - 404 Not Found : Diagramme ou commit introuvable\n          - 400 Bad Request : Diagramme pas encore sauvegard\xE9 sur GitHub\n  - info:\n      name: Projets\n      type: folder\n    items:\n      - info:\n          name: Get Project\n          type: http\n          seq: 3\n        http:\n          method: GET\n          url: '{{baseUrl}}/projets/:id'\n          params:\n            - name: id\n              value: PROJECT_UUID_HERE\n              type: path\n          auth:\n            type: bearer\n            token: '{{token}}'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # R\xE9cup\xE9rer un projet sp\xE9cifique\n\n          Retourne les d\xE9tails d'un projet avec ses diagrammes et collaborateurs.\n\n          ## Headers requis :\n          - `Authorization: Bearer <JWT_TOKEN>`\n\n          ## Param\xE8tres URL :\n          - `id` (UUID) : Identifiant du projet\n\n          ## R\xE9ponse (200 OK) :\n          ```json\n          {\n            \"id\": \"uuid-projet\",\n            \"idProprietaire\": \"uuid-user\",\n            \"titre\": \"Mon Projet\",\n            \"description\": \"Description...\",\n            \"cheminGit\": \"Kwilium54/mon-projet\",\n            \"public\": false,\n            \"dateCreation\": \"2026-02-12T...\",\n            \"dateModification\": \"2026-02-12T...\",\n            \"diagrammes\": [\n              {\n                \"id\": \"uuid-diag\",\n                \"titre\": \"Diagramme 1\",\n                \"type\": \"mermaid\",\n                ...\n              }\n            ],\n            \"collaborations\": [\n              {\n                \"id\": \"uuid-collab\",\n                \"droit\": \"ecriture\",\n                \"utilisateur\": {\n                  \"id\": \"uuid\",\n                  \"nom\": \"Doe\",\n                  \"prenom\": \"John\",\n                  \"email\": \"john@example.com\"\n                }\n              }\n            ]\n          }\n          ```\n\n          ## Permissions :\n          - Accessible si : propri\xE9taire, collaborateur, ou projet public\n\n          ## Erreurs :\n          - 403 Forbidden : pas d'acc\xE8s au projet\n          - 404 Not Found : projet introuvable\n      - info:\n          name: Delete Project\n          type: http\n          seq: 4\n        http:\n          method: DELETE\n          url: '{{baseUrl}}/projets/:id'\n          params:\n            - name: id\n              value: PROJECT_UUID_HERE\n              type: path\n          auth:\n            type: bearer\n            token: '{{token}}'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Supprimer un projet\n\n          Supprime un projet et son d\xE9p\xF4t GitHub associ\xE9.\n\n          ## Headers requis :\n          - `Authorization: Bearer <JWT_TOKEN>`\n\n          ## Param\xE8tres URL :\n          - `id` (UUID) : Identifiant du projet\n\n          ## R\xE9ponse (204 No Content) :\n          - Aucun contenu retourn\xE9 en cas de succ\xE8s\n\n          ## Actions automatiques :\n          1. Suppression du d\xE9p\xF4t GitHub via API\n          2. Suppression en cascade des diagrammes associ\xE9s\n          3. Suppression des collaborations\n          4. Suppression du projet de la BD\n\n          ## Permissions :\n          - Seul le **propri\xE9taire** peut supprimer le projet\n\n          ## Erreurs :\n          - 403 Forbidden : seul le propri\xE9taire peut supprimer\n          - 404 Not Found : projet introuvable\n\n          ## \u26A0\uFE0F Attention :\n          - Action **irr\xE9versible**\n          - Le d\xE9p\xF4t GitHub est **d\xE9finitivement supprim\xE9**\n      - info:\n          name: Save Project to GitHub\n          type: http\n          seq: 5\n        http:\n          method: POST\n          url: '{{baseUrl}}/projets/:id/save'\n          params:\n            - name: id\n              value: '{{projetId}}'\n              type: path\n          auth:\n            type: bearer\n            token: '{{authToken}}'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Sauvegarder un projet vers GitHub\n\n          Sauvegarde tous les diagrammes d'un projet vers le d\xE9p\xF4t GitHub associ\xE9.\n\n          ## D\xE9tails\n          - Le propri\xE9taire ou les collaborateurs avec droit d'\xE9criture peuvent sauvegarder\n          - Chaque diagramme est sauvegard\xE9 dans un fichier s\xE9par\xE9 : `diagrams/{slug}.mmd`\n          - Si le fichier existe d\xE9j\xE0, il est mis \xE0 jour (nouveau commit)\n          - Le champ `cheminGit` de chaque diagramme est mis \xE0 jour\n          - Un SHA (identifiant unique) est utilis\xE9 pour \xE9viter d'\xE9craser des modifications\n\n          ## R\xE9ponse\n          ```json\n          {\n            \"success\": true,\n            \"savedDiagrams\": [\n              {\n                \"id\": \"uuid\",\n                \"titre\": \"Mon diagramme\",\n                \"path\": \"diagrams/mon-diagramme.mmd\",\n                \"sha\": \"abc123...\",\n                \"url\": \"https://github.com/user/repo/blob/main/diagrams/mon-diagramme.mmd\"\n              }\n            ],\n            \"errors\": []\n          }\n          ```\n\n          ## Codes d'erreur\n          - 401 Unauthorized : Token JWT invalide\n          - 403 Forbidden : Seul le propri\xE9taire peut sauvegarder\n          - 404 Not Found : Projet introuvable\n          - 400 Bad Request : Pas de d\xE9p\xF4t GitHub associ\xE9\n      - info:\n          name: Create Project\n          type: http\n          seq: 1\n        http:\n          method: POST\n          url: '{{baseUrl}}/projets'\n          body:\n            type: json\n            data: |-\n              {\n                \"titre\": \"Mon Nouveau Projet\",\n                \"description\": \"Description du projet (optionnel)\",\n                \"public\": false\n              }\n          auth:\n            type: bearer\n            token: '{{token}}'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Cr\xE9er un nouveau projet\n\n          Cr\xE9e un nouveau projet avec un d\xE9p\xF4t GitHub associ\xE9.\n\n          ## Headers requis :\n          - `Authorization: Bearer <JWT_TOKEN>`\n          - `Content-Type: application/json`\n\n          ## Body (JSON) :\n          - `titre` (string, requis) : Nom du projet\n          - `description` (string, optionnel) : Description du projet\n          - `public` (boolean, optionnel) : Visibilit\xE9 du d\xE9p\xF4t GitHub (d\xE9faut: false)\n\n          ## R\xE9ponse (201 Created) :\n          ```json\n          {\n            \"id\": \"uuid-du-projet\",\n            \"idProprietaire\": \"uuid-utilisateur\",\n            \"titre\": \"Mon Nouveau Projet\",\n            \"description\": \"Description du projet\",\n            \"cheminGit\": \"Kwilium54/mon-nouveau-projet\",\n            \"public\": false,\n            \"dateCreation\": \"2026-02-12T...\",\n            \"dateModification\": \"2026-02-12T...\"\n          }\n          ```\n\n          ## Actions automatiques :\n          1. Cr\xE9ation d'un d\xE9p\xF4t GitHub priv\xE9/public\n          2. Slug du titre pour le nom du repo (ex: \"Mon Projet\" \u2192 \"mon-projet\")\n          3. Cr\xE9ation d'un README.md initial\n          4. Enregistrement dans la base de donn\xE9es\n\n          ## Erreurs :\n          - 400 Bad Request : titre manquant ou d\xE9p\xF4t existe d\xE9j\xE0\n          - 401 Unauthorized : token invalide\n          - 500 Internal Server Error : erreur GitHub API\n      - info:\n          name: List Projects\n          type: http\n          seq: 2\n        http:\n          method: GET\n          url: '{{baseUrl}}/projets'\n          auth:\n            type: bearer\n            token: '{{token}}'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Lister tous les projets\n\n          R\xE9cup\xE8re tous les projets de l'utilisateur connect\xE9.\n\n          ## Headers requis :\n          - `Authorization: Bearer <JWT_TOKEN>`\n\n          ## R\xE9ponse (200 OK) :\n          ```json\n          [\n            {\n              \"id\": \"uuid-1\",\n              \"idProprietaire\": \"uuid-user\",\n              \"titre\": \"Projet 1\",\n              \"description\": \"Description...\",\n              \"cheminGit\": \"Kwilium54/projet-1\",\n              \"public\": false,\n              \"dateCreation\": \"2026-02-12T...\",\n              \"dateModification\": \"2026-02-12T...\",\n              \"_count\": {\n                \"diagrammes\": 3\n              }\n            },\n            {\n              \"id\": \"uuid-2\",\n              \"titre\": \"Projet 2\",\n              ...\n            }\n          ]\n          ```\n\n          ## Tri :\n          - Par `dateModification` d\xE9croissant (plus r\xE9cent d'abord)\n\n          ## Note :\n          - Retourne uniquement les projets cr\xE9\xE9s via Diagrammer\n          - Inclut le nombre de diagrammes par projet\n  - info:\n      name: Auth\n      type: folder\n    items:\n      - info:\n          name: Get Profile\n          type: http\n          seq: 2\n        http:\n          method: GET\n          url: '{{baseUrl}}/auth/me'\n          auth:\n            type: bearer\n            token: '{{token}}'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # R\xE9cup\xE9rer le profil utilisateur\n\n          Retourne les informations de l'utilisateur connect\xE9.\n\n          ## Headers requis :\n          - `Authorization: Bearer <JWT_TOKEN>`\n\n          ## R\xE9ponse (200 OK) :\n          ```json\n          {\n            \"id\": \"uuid\",\n            \"githubId\": \"120125755\",\n            \"username\": \"Kwilium54\",\n            \"email\": \"user@example.com\",\n            \"avatarUrl\": \"https://avatars.githubusercontent.com/...\",\n            \"createdAt\": \"2026-02-11T...\",\n            \"updatedAt\": \"2026-02-11T...\"\n          }\n          ```\n\n          ## Erreurs :\n          - 401 Unauthorized : token invalide ou manquant\n          - 404 Not Found : utilisateur introuvable\n      - info:\n          name: Login GitHub\n          type: http\n          seq: 1\n        http:\n          method: GET\n          url: '{{baseUrl}}/auth/github'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          # Login GitHub OAuth\n\n          Redirige l'utilisateur vers GitHub pour l'authentification OAuth.\n\n          ## Flow complet :\n          1. Frontend redirige vers `/auth/github`\n          2. GitHub demande l'autorisation\n          3. Callback vers `/auth/github/callback`\n          4. Redirection vers `http://localhost:3000/login?token=JWT_TOKEN`\n\n          ## Scopes OAuth :\n          - `user:email` : r\xE9cup\xE9rer l'email\n          - `repo` : cr\xE9er/g\xE9rer des d\xE9p\xF4ts\nbundled: true\nextensions:\n  bruno:\n    ignore:\n      - node_modules\n      - .git\n    exportedAt: '2026-02-17T13:40:59.480Z'\n    exportedUsing: Bruno/3.0.2\n";
        new window.OpenCollection({
            target: document.getElementById('opencollection-container'),
            opencollection: collectionData,
            theme: 'light'
        });
    </script>
</body>
