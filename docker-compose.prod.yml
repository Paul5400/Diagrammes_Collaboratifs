services:
  back-diagrammer:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/diagram-back:latest
    build:
      context: ./backend
      dockerfile: build_docker/Dockerfile.prod
    ports:
      - '3002:3001'
      - '3032:3032'
    networks:
      - diagrammer.net
    depends_on:
      diagrammer.db:
        condition: service_started
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@diagrammer.db:5432/${DB_NAME}?schema=public
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3001
    restart: unless-stopped

  front-diagrammer:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/diagram-front:latest
    build:
      context: ./frontend
      dockerfile: build_docker/Dockerfile.prod
    ports:
      - '3000:3000'
    networks:
      - diagrammer.net
    depends_on:
      - back-diagrammer
    environment:
      - PORT=3000
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
    restart: unless-stopped

  diagrammer.db:
    image: postgres:16-alpine
    networks:
      - diagrammer.net
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    networks:
      - diagrammer.net
    volumes:
      - redis-data:/data
    restart: unless-stopped

networks:
  diagrammer.net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
